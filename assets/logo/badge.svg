<svg xmlns="http://www.w3.org/2000/svg" width="520" height="600" viewBox="0 0 520 600">
  <!--
    The badge plate: the skin's own stamp, drawn here and rendered to
    assets/logo/plates/badge.png by `node scripts/make-decal.mjs --svg ... --height 300`.

    Same vocabulary as the rest of the skin — an inverted triangle, a 45-degree screen that fades
    toward the apex, a nested outline, a diamond on the axis, a hairline rule and a tracked caption.
    All of it is constructed from primitives in this file. The type is Michroma / JetBrains Mono
    (SIL OFL, vendored in assets/fonts).

    The caption sits under the triangle rather than inside it, and stays short, because this plate
    prints at about 200 px wide: a long line of small type would arrive as a grey smudge, while
    eight tracked capitals still read as a caption at that size.
  -->
  <defs>
    <pattern id="badge-screen" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#FFFFFF" stroke-width="1.4" />
    </pattern>
    <linearGradient id="badge-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.1" />
    </linearGradient>
    <mask id="badge-mask">
      <rect x="0" y="0" width="480" height="560" fill="url(#badge-fade)" />
    </mask>
    <clipPath id="badge-clip">
      <polygon points="120,12 360,12 240,212" />
    </clipPath>
    <clipPath id="badge-clip-inner">
      <polygon points="168,36 312,36 240,150" />
    </clipPath>
  </defs>

  <!-- the screen, twice: across the triangle, and again inside the nested outline -->
  <g clip-path="url(#badge-clip)" mask="url(#badge-mask)">
    <rect x="0" y="0" width="480" height="560" fill="url(#badge-screen)" />
  </g>
  <g clip-path="url(#badge-clip-inner)" opacity="0.45">
    <rect x="0" y="0" width="480" height="560" fill="url(#badge-screen)" />
  </g>

  <!-- the frame: outline, nested outline, axis diamond -->
  <polygon points="120,12 360,12 240,212" fill="none" stroke="#D9D9D9" stroke-width="3" />
  <polygon points="168,36 312,36 240,150" fill="none" stroke="#D9D9D9" stroke-width="1.4" opacity="0.6" />
  <rect x="234" y="78" width="12" height="12" transform="rotate(45 240 84)" fill="#D9D9D9" />

  <!-- the workshop line: hairline rule, then the caption -->
  <rect x="120" y="244" width="240" height="2" fill="#D9D9D9" opacity="0.6" />
  <text x="128" y="290" font-family="JetBrains Mono" font-size="30" letter-spacing="10" fill="#D9D9D9">ENDFIELD</text>
</svg>
